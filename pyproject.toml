[project]
name = "mensrise-bot"
version = "0.1.0"
description = "Telegram bot for viewing participant activity and ratings"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "python-telegram-bot>=22.8",
    "load-dotenv>=0.1.0",
]

[project.scripts]
mensrise-bot = "MensRise_bot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"