[project]
name = "risebot"
version = "0.2.0"
description = "Telegram bot for viewing participant activity and ratings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=20.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
risebot = "bot_package.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_package"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"